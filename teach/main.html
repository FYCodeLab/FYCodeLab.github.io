<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Educational Games</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px;
      font-family: Arial, sans-serif;
      background: #f4f6fa;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    /* Game thumbnails */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
      max-width: 1100px;
      margin: auto;
    }

    .game-card {
      border: 0;
      padding: 0;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .game-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
    }

    .game-card img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
    }

    .game-card span {
      display: block;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    /* Dark background behind the opened game */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 15, 25, 0.75);
      backdrop-filter: blur(5px);

      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .overlay.open {
      opacity: 1;
      visibility: visible;
    }

    /* Game window */
    .game-window {
      position: relative;
      width: 80vw;
      height: 80vh;
      overflow: hidden;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.45);

      transform: scale(0.15);
      opacity: 0;
      transition:
        transform 0.45s cubic-bezier(.2, .8, .2, 1),
        opacity 0.25s;
    }

    .overlay.open .game-window {
      transform: scale(1);
      opacity: 1;
    }

    .game-window iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    /* Close button */
    .close-button {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;

      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .close-button:hover {
      background: #d53030;
    }

    @media (max-width: 700px) {
      body {
        padding: 20px;
      }

      .game-window {
        width: 94vw;
        height: 85vh;
      }
    }
  </style>
</head>

<body>
  <h1>Educational Games</h1>

  <main class="game-grid">

    <button class="game-card"
            data-game="reg.html"
            aria-label="Open regression game">
      <img src="images/regression.jpg" alt="Regression game">
      <span>Regression Game</span>
    </button>

    <button class="game-card"
            data-game="regneur.html"
            aria-label="Open neuron game">
      <img src="images/neuron.jpg" alt="Neuron game">
      <span>Neuron Game</span>
    </button>

    <button class="game-card"
            data-game="two_variable_plane_neuron_lab.html"
            aria-label="Open two-variable neuron lab">
      <img src="images/two-variable.jpg" alt="Two-variable neuron lab">
      <span>Two-Variable Neuron Lab</span>
    </button>

  </main>

  <div class="overlay" id="gameOverlay" aria-hidden="true">
    <div class="game-window" role="dialog" aria-modal="true">
      <button class="close-button"
              id="closeButton"
              aria-label="Close game">&times;</button>

      <iframe
        id="gameFrame"
        title="Educational game"
        allow="fullscreen">
      </iframe>
    </div>
  </div>

  <script>
    const overlay = document.getElementById("gameOverlay");
    const iframe = document.getElementById("gameFrame");
    const closeButton = document.getElementById("closeButton");
    const gameCards = document.querySelectorAll(".game-card");

    function openGame(gameUrl) {
      iframe.src = gameUrl;
      overlay.classList.add("open");
      overlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      closeButton.focus();
    }

    function closeGame() {
      overlay.classList.remove("open");
      overlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";

      // Stops the game, sounds and animations after closing.
      setTimeout(() => {
        iframe.src = "";
      }, 450);
    }

    gameCards.forEach(card => {
      card.addEventListener("click", () => {
        openGame(card.dataset.game);
      });
    });

    closeButton.addEventListener("click", closeGame);

    // Close by clicking on the dark background.
    overlay.addEventListener("click", event => {
      if (event.target === overlay) {
        closeGame();
      }
    });

    // Close with the Escape key.
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" &&
          overlay.classList.contains("open")) {
        closeGame();
      }
    });
  </script>
</body>
</html>
