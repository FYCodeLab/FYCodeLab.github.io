<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mini Teachable Machine</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/knn-classifier"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 30px;
      background: #f6f7fb;
      color: #172033;
    }

    h1 {
      margin-top: 0;
    }

    video {
      width: 420px;
      max-width: 100%;
      border-radius: 18px;
      background: #ddd;
    }

    button {
      margin: 8px 5px 8px 0;
      padding: 12px 18px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    .class-a {
      background: #5865f2;
      color: white;
    }

    .class-b {
      background: #e75a7c;
      color: white;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 16px;
      font-size: 22px;
    }
  </style>
</head>

<body>

<h1>Mini Teachable Machine</h1>

<p>
  Show examples to the camera, add them to Class A or Class B,
  and then let the computer classify what it sees.
</p>

<video id="webcam" autoplay playsinline></video>

<div>
  <button class="class-a" onclick="addExample(0)">
    Add example to Class A
  </button>

  <button class="class-b" onclick="addExample(1)">
    Add example to Class B
  </button>
</div>

<p>
  Class A examples: <span id="countA">0</span><br>
  Class B examples: <span id="countB">0</span>
</p>

<div class="result" id="result">
  Waiting for examples…
</div>

<script>

const classifier = knnClassifier.create();

let mobilenetModel;
let webcam;

let countA = 0;
let countB = 0;

async function setup() {

  mobilenetModel = await mobilenet.load();

  webcam = document.getElementById("webcam");

  const stream = await navigator.mediaDevices.getUserMedia({
    video: true,
    audio: false
  });

  webcam.srcObject = stream;

  webcam.onloadeddata = () => {
    predict();
  };
}

function getActivation() {

  return tf.tidy(() => {

    const image = tf.browser.fromPixels(webcam);

    return mobilenetModel.infer(image, true);

  });
}

function addExample(classId) {

  const activation = getActivation();

  classifier.addExample(activation, classId);

  activation.dispose();

  if (classId === 0) {
    countA++;
    document.getElementById("countA").textContent = countA;
  }

  if (classId === 1) {
    countB++;
    document.getElementById("countB").textContent = countB;
  }
}

async function predict() {

  if (
    classifier.getNumClasses() > 0 &&
    countA > 0 &&
    countB > 0
  ) {

    const activation = getActivation();

    const prediction =
      await classifier.predictClass(activation);

    activation.dispose();

    const name =
      prediction.label === "0"
      ? "Class A"
      : "Class B";

    const confidence =
      prediction.confidences[prediction.label];

    document.getElementById("result").innerHTML =
      "<strong>" + name + "</strong><br>" +
      Math.round(confidence * 100) + "% confidence";
  }

  requestAnimationFrame(predict);
}

setup();

</script>

</body>
</html>
